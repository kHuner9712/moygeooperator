# MOY GEO Operator — Internal · Stage 1 + Stage 3 tooling + Stage 4 LLM
# PostgreSQL = System of Record · NocoDB = ops UI · n8n = orchestration
# Ollama = default local LLM (WF-01/04/06 observer & extraction).
# SearXNG + Crawl4AI are WF-02 discovery tools, gated behind the `tooling`
# profile: `docker compose --profile tooling up` starts them when needed.
# All business data lives in postgres; NocoDB/n8n only add their own metadata DBs.
name: geo-operator

services:
  postgres:
    image: postgres:16-alpine
    container_name: geo-operator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo_operator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-geo_operator}
      # Per-service databases are created by the init script below.
      NOCODB_DB: ${NOCODB_DB:-nocodb}
      N8N_DB: ${N8N_DB:-n8n}
    ports:
      - "${POSTGRES_PORTMAP:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/srv/db:ro
      - ./scripts:/srv/scripts:ro
      - ./tests:/srv/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo_operator} -d ${POSTGRES_DB:-geo_operator}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nocodb:
    # Pinned: verified operator UI version (2026-05). Do not drift to :latest.
    image: nocodb/nocodb:0.263.1
    container_name: geo-operator-nocodb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NocoDB's own metadata DB (same postgres server).
      NC_DB: "pg://${NOCODB_NC_DB_HOST:-postgres}:${NOCODB_NC_DB_PORT:-5432}?u=${NOCODB_NC_DB_USER:-geo_operator}&p=${NOCODB_NC_DB_PASSWORD}&d=${NOCODB_NC_DB_DATABASE:-nocodb}"
      NC_PUBLIC_URL: "http://localhost:${NOCODB_PORTMAP:-8080}"
      NC_DISABLE_TELE: "true"
    ports:
      - "${NOCODB_PORTMAP:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  n8n:
    # Pinned: verified orchestration version (2026-08 stable). Do not drift to :latest.
    image: n8nio/n8n:2.34.5
    container_name: geo-operator-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: ${N8N_DB_TYPE:-postgresdb}
      DB_POSTGRESDB_HOST: ${N8N_DB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${N8N_DB_PORT:-5432}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-geo_operator}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD required}
      DB_POSTGRESDB_DATABASE: ${N8N_DB_DATABASE:-n8n}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-operator}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD required}
      N8N_DEFAULT_BINARY_DATA_MODE: "${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}"
      N8N_USER_FOLDER: ${N8N_USER_FOLDER:-/home/node/.n8n}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY required}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EXCEPTION_NOTIFY_URL: ${EXCEPTION_NOTIFY_URL:-}
      EXCEPTION_NOTIFY_SECRET: ${EXCEPTION_NOTIFY_SECRET:-}
      # Allow $env access in node expressions (used by WF-08 Notify exceptions).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
    ports:
      - "${N8N_PORTMAP:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    # Local LLM runtime. NOTE: the previously pinned :0.32.7 tag does not exist
    # on the registry, so we pin to :latest (the tag present locally). Re-pin to
    # a verified immutable digest before production.
    image: ollama/ollama:latest
    container_name: geo-operator-ollama
    restart: unless-stopped
    # Default local LLM (WF-01 extraction, WF-04 observer, WF-06 content).
    # n8n calls it at http://ollama:11434/api/generate with ${OLLAMA_MODEL}.
    environment:
      OLLAMA_HOST: "0.0.0.0:${OLLAMA_URLPORT:-11434}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
    ports:
      - "${OLLAMA_PORTMAP:-11434}:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

# ---- Stage 3 tooling (WF-02 discovery). Start explicitly via profile. ----
  searxng:
    # Tooling profile only (WF-02 discovery). Pin to a verified tag before prod.
    image: searxng/searxng:latest
    profiles: ["tooling"]
    container_name: geo-operator-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://localhost:${SEARXNG_PORTMAP:-8888}/"
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-searxng-secret}
    ports:
      - "${SEARXNG_PORTMAP:-8888}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  crawl4ai:
    # Tooling profile only (WF-02 discovery). Pin to a verified tag before prod.
    image: unclecode/crawl4ai:latest
    profiles: ["tooling"]
    container_name: geo-operator-crawl4ai
    restart: unless-stopped
    ports:
      - "${CRAWL4AI_PORTMAP:-11235}:8000"

  truth-extractor:
    # Tooling profile only (P0.2 — WF-01 PDF/URL Truth extraction).
    # Started via: docker compose --profile tooling up truth-extractor
    build: ./services/truth-extractor
    profiles: ["tooling"]
    image: geo-operator-truth-extractor:local
    container_name: geo-operator-truth-extractor
    restart: unless-stopped
    environment:
      # P0.9/P0.10 — client-scoped local file intake root. Only
      # <TRUTH_ROOT>/<client_id>/ is readable; see services/truth-extractor/app.py.
      TRUTH_ROOT: "${TRUTH_ROOT:-/data/truth}"
    ports:
      - "${TRUTH_EXTRACTOR_PORTMAP:-9000}:9000"
    volumes:
      # Bind the host truth dir so operators can drop client PDFs in place.
      - "${TRUTH_HOST_DIR:-./data/truth}:/data/truth"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  n8ndata:
  ollamadata: