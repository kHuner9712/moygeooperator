name: CI

# Lightweight verification gate (P0.12). Runs static checks + a clean-Postgres
# integration sweep in minutes. Does NOT pull large Ollama models or run heavy
# browser/tooling E2E — those are deferred to the local staged release check.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geo_operator
          POSTGRES_PASSWORD: ci-pass
          POSTGRES_DB: geo_operator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo_operator -d geo_operator"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: geo_operator
      PGPASSWORD: ci-pass
      PGDATABASE: geo_operator

    steps:
      - uses: actions/checkout@v4

      - name: Workflow JSON parse validation (LEVEL 0)
        run: |
          for f in n8n/workflows/wf*.json; do
            python -c "import json,sys; json.load(open('$f'))" || { echo "invalid: $f"; exit 1; }
          done

      - name: Forbidden runtime string scan (P0.1)
        run: |
          set -e
          bad=$(grep -RIl --exclude-dir='.git' -e 'SYNTH-ACME' -e 'simulated publish' n8n/workflows/ || true)
          if [ -n "$bad" ]; then echo "forbidden strings in: $bad"; exit 1; fi
          bad=$(grep -RIl --exclude-dir='.git' -e 'factuality = mentioned' -e 'mentioned ? .CORRECT.' n8n/workflows/ || true)
          if [ -n "$bad" ]; then echo "raw mentioned=CORRECT factuality in: $bad"; exit 1; fi
          echo "scan clean"

      - name: Workflow contract static check (LEVEL 0)
        run: python3 scripts/deploy/static-contract-check.py n8n/workflows

      - name: Truth-extractor security unit tests (P0.9/P0.10/P0.11/P0.12)
        run: |
          pip install -q -r services/truth-extractor/requirements.txt
          python tests/truth_extractor_security_test.py

      - name: Apply migrations on clean PostgreSQL (P0.12 / LEVEL 2)
        run: |
          for f in db/migrations/[0-9]*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Apply views
        run: |
          for f in db/views/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Apply synthetic seeds (test fixtures only, dependency order)
        run: bash db/run-seeds.sh

      - name: Two-client isolation + queue + truth + intent + fact-gate + publication fail-closed (LEVEL 2)
        run: psql -v ON_ERROR_STOP=1 -q < tests/integration/runtime_convergence_verify.sql

      - name: Truth intake DB integration
        run: psql -v ON_ERROR_STOP=1 -q < tests/integration/truth_intake_verify.sql

      - name: Intent pipeline DB integration
        run: psql -v ON_ERROR_STOP=1 -q < tests/integration/surface_intent_verify.sql

      - name: Publication fail-closed integration
        run: psql -v ON_ERROR_STOP=1 -q < tests/integration/publication_verify.sql

      - name: Shadow Runtime DB-contract E2E (WF-01..WF-08 + isolation + job lifecycle)
        run: psql -v ON_ERROR_STOP=1 -q < tests/integration/shadow_runtime_e2e.sql